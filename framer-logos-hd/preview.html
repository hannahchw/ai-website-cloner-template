<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#f3f0ea;font-family:system-ui,sans-serif}
.wrap{padding:32px 16px;max-width:1080px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}
.card{background:#fff;border-radius:16px;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;padding:14px}
.card img{max-width:80%;max-height:66%;object-fit:contain}
.ph{font-size:12px;color:#b45309;text-align:center;border:1px dashed #d97706;border-radius:8px;padding:8px}
.grid>.card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
@media(min-width:768px){.grid>.card:last-child:nth-child(odd){grid-column:auto;width:auto}.grid>.card:nth-child(7){grid-column:2}}
@media(min-width:1100px){.grid>.card:nth-child(7){grid-column:auto}}
</style></head><body><div class="wrap"><div class="grid">
<div class="card"><div class="ph">Google Partner Premier<br>(keep current file)</div></div>
<div class="card"><img src="02-meta-facebook-business-partner.png"></div>
<div class="card"><img src="03-hubspot-platinum-horizontal.png"></div>
<div class="card"><img src="04-google-analytics-certified-partner.png"></div>
<div class="card"><img src="05-microsoft-advertising.png"></div>
<div class="card"><img src="06-am-agency-of-year-markies-2022.png"></div>
<div class="card"><img src="07-am-silver-2022.png"></div>
</div></div></body></html>
